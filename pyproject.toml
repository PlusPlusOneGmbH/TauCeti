[project]
name = "tdp-TauCeti"
version = "5.1.8"
description = "Presetmanagement and parameer manipulation in TouchDesigner."
readme = "README.md"
license-files = [ "LICENSE",]
requires-python = ">=3.11"
keywords = [ "TouchDesigner", "Parameter", "Tweener", "2025.32460",]
dependencies = []
[[project.authors]]
name = "Wieland Hilker"
email = "wieland@plusplus.one"

[build-system]
requires = [ "setuptools>=61.0",]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [ "monkeybrain>=0.3.0",]

[project.urls]
Website = "https://plusplus.one"
Repository = "https://github.com/PlusPlusOneGmbH/TD_TauCeti_Presetsystem"

[tool.monkeybrain]
projectfile = "TauCeti_PresetSystem.toe"
enforce-version = "latest-build"
touchdesigner-version = "2025.32280"

[tool.touchdesigner.TDPyEnvManagerContext]
contextVersion = 2
createdByVersion = "1.4.0"
active = true
mode = "Python vEnv"
envName = ".venv"
installPath = "."
pythonVersion = "3.11"
autoSetup = false
autoSetupReqs = []
autoSetupSyncReqs = false
extraPaths = ["src"]

[tool.setuptools.package-data]
"*" = [ "*.tox",]

[tool.setuptools.packages.find]
where = [ "src",]
